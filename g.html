<!DOCTYPE html>
<html lang="hi-Latn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Ek shubhkamna 🌼</title>
  <meta property="og:title" content="Ek chhoti si shubhkamna 🌼">
  <meta property="og:description" content="Bas 2 minute. Ye surprise hai 🤫">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,400..600,0..100,0..1;1,9..144,400..500,0..100,0..1&family=Mukta:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="assets/styles.css">
  <style>
    .field-label { display: block; font-weight: 600; margin: 18px 0 4px; }
    .thumbs { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
    .thumbs img { width: 84px; height: 84px; object-fit: cover; border-radius: 6px; border: 3px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.15); }
    .card { background: var(--ss-paper-deep); border-radius: 10px; padding: 18px; margin-top: 18px; box-shadow: inset 0 0 0 1px var(--ss-paper-edge); }
    .card h2 { font-family: var(--ss-font-q); font-weight: 500; font-size: 1.35rem; margin: 0 0 8px; }
  </style>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <div id="app"></div>
  <div id="live" class="sr-only" aria-live="polite"></div>
  <script src="content.js"></script>
  <script src="assets/core.js"></script>
  <script src="assets/motifs.js"></script>
  <script src="assets/ui.js"></script>
  <script>
  (function () {
    'use strict';
    const esc = SS.esc, r = SS.r, t = SS.t;
    const $app = document.getElementById('app');
    const p = new URLSearchParams(location.search);
    const i = parseInt(p.get('i'), 10);
    const invite = Number.isInteger(i) && GREETINGS[i] ? GREETINGS[i] : null;
    const DEFAULT_ASK = 'Ek shubhkamna, aur agar ho sake toh unke saath ki ek pyaari yaad.';
    const fromName = invite && !SS.isPH(invite.from) ? r(invite.from) : (p.get('name') || '');
    const ask = r((invite && invite.ask) || DEFAULT_ASK);
    const maxSec = 180;
    const state = { segments: [], photos: [], dur: 0 };
    const tribute = p.get('tribute') === '1';

    UI.setBody('');
    $app.innerHTML = `<main class="screen">
      <div style="text-align:center">${MOTIF.diya('lit')}</div>
      <h1 class="big-title" style="text-align:center;font-size:1.9rem">${esc(tribute ? 'Ek yaad, unke liye' : t('g.welcome'))}</h1>
      <p class="muted" style="text-align:center">${esc(tribute
        ? 'Ye janamdin pe nahi, kitaab ke ek alag, shaant hisse mein dikhegi.'
        : 'Ye surprise hai, ' + SS.addressWord() + ' ko mat batana 🤫')}</p>

      <div class="card"><h2>${esc(ask)}</h2></div>

      <label class="field-label" for="nm">Aapka naam</label>
      <input class="field" id="nm" value="${esc(fromName)}" autocomplete="name">
      <label class="field-label" for="rel">${esc(SS.addressWord())} se rishta</label>
      <input class="field" id="rel" value="${esc(invite ? r(invite.relation || '') : '')}">

      <div class="card">
        <h2>Bolein (sabse achha, ${maxSec / 60} minute tak)</h2>
        <div class="recorder">
          <button class="diya-btn" id="diya" aria-pressed="false" aria-label="Bolna shuru karein">${MOTIF.diya('unlit')}</button>
          <div class="rec-label" id="rl">Diya dabaiye aur boliye</div>
          <div class="timer" id="tm"></div>
          <div id="ctl"></div>
        </div>
      </div>

      <div class="card">
        <h2>Likhein</h2>
        <label class="field-label" for="msg">Shubhkamna</label>
        <textarea class="textarea" id="msg" lang="hi-Latn" placeholder="Yahan likhiye…"></textarea>
        <label class="field-label" for="mem">Ek yaad ${esc(SS.addressWord())} ke saath (agar mann ho)</label>
        <textarea class="textarea" id="mem" lang="hi-Latn" style="min-height:6em"></textarea>
      </div>

      <div class="card">
        <h2>Photo (5 tak)</h2>
        <input type="file" id="ph" accept="image/*" multiple class="field">
        <div class="thumbs" id="thumbs"></div>
        <p class="faint">Video ho toh seedha WhatsApp pe Sunny ko bhej dijiye.</p>
      </div>

      <p class="pin-msg" id="err" role="alert"></p>
      <button class="btn" id="send" style="margin-top:18px">Send</button>
      <p class="faint" style="margin-top:10px">"Send" dabane pe ek file banegi. WhatsApp chuniye aur ${esc((EDITION.helpContact && EDITION.helpContact.label) || 'Sunny')} ko bhej dijiye.</p>
    </main>`;

    // ---- voice ----
    const $d = $app.querySelector('.diya'), $btn = $app.querySelector('#diya'), $ctl = $app.querySelector('#ctl'), $tm = $app.querySelector('#tm'), $rl = $app.querySelector('#rl');
    let rec = null;
    const setD = (c) => { $d.classList.remove('unlit', 'lit', 'ember'); $d.classList.add(c); };
    $btn.addEventListener('click', async () => {
      if (rec && rec.state !== 'stopped') return stop();
      if (!SS.micSupported()) { $rl.textContent = 'Is browser mein bolna nahi chal raha. Chrome/Safari mein kholiye (link copy karke), ya likh dijiye.'; return; }
      state.segments = []; state.dur = 0;
      rec = new SS.Recorder('greeting', 1, {
        onLevel(l) { $d.style.setProperty('--lvl', l.toFixed(3)); },
        onTick(ms) { $tm.textContent = SS.fmtTime(ms) + ' / ' + SS.fmtTime(maxSec * 1000); if (ms >= maxSec * 1000) stop(); },
        onState(s) {
          if (s === 'recording') { setD('lit'); $btn.setAttribute('aria-pressed', 'true'); $rl.textContent = 'Boliye… ho jaaye toh "Stop" dabaiye'; $ctl.innerHTML = `<button class="btn ink" id="bas" style="margin-top:10px">${MOTIF.stop()}<span>Stop</span></button>`; $ctl.querySelector('#bas').onclick = stop; }
        }
      });
      try { await rec.start(); } catch (e) { rec = null; setD('unlit'); $rl.textContent = 'Microphone ki ijaazat nahi mili. Settings mein allow kijiye, ya likh dijiye.'; }
    });
    async function stop() {
      if (!rec || rec.state === 'stopped' || stop.busy) return;
      stop.busy = true;
      const res = await rec.stop();
      stop.busy = false;
      state.segments = res.segments; state.dur = res.durationMs;
      setD('ember'); $btn.setAttribute('aria-pressed', 'false');
      $rl.textContent = 'Aawaaz sambhaal li';
      $tm.textContent = SS.fmtTime(state.dur);
      $ctl.innerHTML = `<div class="review">${UI.playBtnHTML('data-me', 'Play')}</div><button class="btn ghost" id="again">${MOTIF.redo()}<span>Record again</span></button>`;
      UI.wirePlay($ctl, () => SS.segmentBlobs(state.segments));
      $ctl.querySelector('#again').onclick = () => { SS.player.stop(); state.segments = []; $ctl.innerHTML = ''; $tm.textContent = ''; setD('unlit'); rec = null; $btn.click(); };
    }

    // ---- photos (resized on the phone before packing) ----
    function resize(file) {
      return new Promise((res, rej) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          const max = 1600, s = Math.min(1, max / Math.max(img.width, img.height));
          const c = document.createElement('canvas');
          c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          URL.revokeObjectURL(url);
          res(c.toDataURL('image/jpeg', 0.82));
        };
        img.onerror = rej;
        img.src = url;
      });
    }
    $app.querySelector('#ph').addEventListener('change', async (e) => {
      const files = [...e.target.files].slice(0, 5 - state.photos.length);
      for (const f of files) { try { state.photos.push(await resize(f)); } catch (err) { /* skip unreadable */ } }
      $app.querySelector('#thumbs').innerHTML = state.photos.map((d, k) => `<img src="${d}" alt="Photo ${k + 1}">`).join('');
      e.target.value = '';
    });

    // ---- send ----
    const b64 = (blob) => new Promise((res) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1]); fr.readAsDataURL(blob); });
    $app.querySelector('#send').addEventListener('click', async () => {
      const err = $app.querySelector('#err');
      const name = $app.querySelector('#nm').value.trim();
      const text = $app.querySelector('#msg').value.trim();
      const memory = $app.querySelector('#mem').value.trim();
      if (!name) { err.textContent = 'Apna naam likh dijiye'; $app.querySelector('#nm').focus(); return; }
      if (!text && !memory && !state.segments.length && !state.photos.length) { err.textContent = 'Kuch bolein, likhein ya photo jodiye'; return; }
      err.textContent = '';
      let audio = null;
      if (state.segments.length) {
        const blobs = await SS.segmentBlobs(state.segments);
        const blob = new Blob(blobs, { type: blobs[0].type });
        audio = { mime: blob.type, durationMs: state.dur, data: await b64(blob) };
      }
      const payload = {
        format: 'sunao-na-greeting/1', edition: EDITION.slug, invite: Number.isInteger(i) ? i : null,
        placement: tribute ? 'tribute' : 'wall',
        from: name, relation: $app.querySelector('#rel').value.trim(), text, memory, audio,
        photos: state.photos.map((d) => d.split(',')[1]), at: new Date().toISOString()
      };
      const slug = name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'greeting';
      const file = new File([JSON.stringify(payload)], `shubhkamna-${slug}.json`, { type: 'application/json' });
      const res = await SS.shareOrDownload(file, 'Shubhkamna – ' + name);
      if (res === 'cancelled') return;
      const date = SS.formatDate(EDITION.occasionDate) || 'janamdin';
      $app.innerHTML = `<main class="screen center">${MOTIF.diya('lit')}
        <h1 class="big-title" style="margin-top:20px">${esc(t('g.thanks', { date }))}</h1>
        ${res === 'downloaded' ? `<p class="muted">File phone mein save ho gayi hai (${esc(file.name)}). Use WhatsApp pe ${esc((EDITION.helpContact && EDITION.helpContact.label) || 'Sunny')} ko bhej dijiye.</p>` : ''}
      </main>`;
      UI.petals(24);
    });
  })();
  </script>
</body>
</html>
